name: YouTube Live Recorder

# ============================================================
# Keeby YouTube Live Recorder（GitHub Actions版）
#
# 旧Xserver VPS（終了）の代わりに、GitHub Actionsのcronで
# 「ライブ検知 → 録画 → Google Driveへアップロード」を1回のjobで完結させる。
#
# 設計上のポイント:
#   * GitHubのscheduleは15分間隔では来ない（実測 中央値5.3時間）。
#     そのため job 自体が最大4時間ライブを監視し、終了時に次jobを自己起動する
#     （WATCH_MAX_SECONDS / SELF_DISPATCH）。cronは連鎖が切れたときの保険。
#   * cronの「:00」は実行が集中して遅延・dropが起きやすいため、意図的にずらしている。
#   * timeout-minutes はActionsの6時間上限に少し余裕を持たせて350分(=約5.8時間)。
#     （ユーザー前提: 1回のライブは6時間未満）
#   * 自分のPCの電源が入っていなくても GitHub側のランナーが実行する。
#   * public repo なので標準ランナーは無料・無制限・支払い方法登録も不要。
# ============================================================

on:
  schedule:
    # 15分間隔（毎時0分は避ける: 分5,20,35,50）
    # GitHub Actionsのcronは5フィールド必須（分 時 日 月 曜日）
    - cron: '5,20,35,50 * * * *'
  # 手動実行（初回テスト用・ドライラン用）
  # ドライラン例: test_live_url に適当なライブ/動画URL、test_max_seconds に 90、
  # skip_upload に true を指定すると、Drive に触らず artifact で回収できる。
  workflow_dispatch:
    inputs:
      test_live_url:
        description: 'テスト用URL（空なら通常のAPI検知。例: https://www.youtube.com/watch?v=...）'
        required: false
        default: ''
        type: string
      test_max_seconds:
        description: 'テスト録画秒数（0=打ち切りなし本番動作。例: 90）'
        required: false
        default: '0'
        type: string
      skip_upload:
        description: 'Driveへ上げずローカル保持（テスト用）'
        required: false
        default: false
        type: boolean
      watch_seconds:
        description: '手動実行時の監視秒数（0=1回だけ。本番はcronで自動設定）'
        required: false
        default: '0'
        type: string
      max_download_gb:
        description: 'ダウンロード上限GB（0=無制限。例: 2.5 で約2.5GBで打ち切り）'
        required: false
        default: '0'
        type: string
      probe_only:
        description: '経路の実測だけ行う（DLせず、どのplayer_clientが通るか確認）'
        required: false
        default: false
        type: boolean
      use_warp:
        description: 'Cloudflare WARP 経由にする（出口IPを変える）'
        required: false
        default: false
        type: boolean

# 同時実行させない（前の録画中に次のcronが走って二重録画＆runner枠の消費を防ぐ）
permissions:
  contents: read
  actions: write   # 監視jobの自己ディスパッチ（cron間引き対策）に必要
  issues: write    # 失敗時にIssueを作成して気づけるようにする

concurrency:
  # 手動テスト（test_live_url 指定）は監視チェーンと別グループにして、
  # 4時間の監視jobが走っていても待たされないようにする。
  group: youtube-recorder-${{ (github.event_name == 'workflow_dispatch' && inputs.test_live_url != '') && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  record:
    # public repo なので標準ランナーが無料・無制限（4 vCPU / 16GB RAM / 14GB SSD）
    runs-on: ubuntu-latest
    # Actionsのjob実行時間上限（6時間）に少し余裕を持たせる
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: bash setup_dependencies.sh

      - name: Setup PO token provider (bgutil)
        # Cookie なしで player API を通すため。失敗しても警告のみで続行する。
        run: bash setup_potoken.sh

      - name: Setup Cloudflare WARP (optional)
        # GitHub Actions の共有IPは YouTube に bot 扱いされるため、
        # 出口IPを変えたいときだけ使う。失敗しても直接接続で続行する。
        # schedule 実行では常に有効（手動は use_warp=true のとき）。
        if: ${{ github.event_name == 'schedule' || inputs.use_warp }}
        run: bash setup_warp.sh

      - name: Setup rclone (Google Drive)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: bash setup_rclone.sh

      - name: Write cookies.txt (if secret exists)
        # cookies.txt は YouTube の 403 対策に使用する。Secret 未設定でも動くようにする。
        # workspace 直下に置き、次の step へ COOKIES_FILE で明示的に渡す
        # （$HOME に置くと Run recorder 側でパス解決が曖昧になるため）。
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "${COOKIES_TXT:-}" ]; then
            printf '%s' "${COOKIES_TXT}" > "${{ github.workspace }}/cookies.txt"
            echo "cookies.txt written."
          else
            echo "COOKIES_TXT not set. Continuing without cookies."
          fi

      - name: Run recorder
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
          GDRIVE_VIDEO_DEST: ${{ vars.GDRIVE_VIDEO_DEST }}
          GDRIVE_COMMENT_DEST: ${{ vars.GDRIVE_COMMENT_DEST }}
          YT_DLP_BIN: /usr/local/bin/yt-dlp
          # rclone の実体は installer 任せ（/usr/bin 配下になる場合あり）のため
          # PATH 解決に任せる。setup_rclone.sh の `rclone listremotes` と同じ解決になる。
          RCLONE_BIN: rclone
          KEEBY_BASE_DIR: ${{ github.workspace }}
          LOG_DIR: ${{ github.workspace }}/logs
          COOKIES_FILE: ${{ github.workspace }}/cookies.txt
          TEST_LIVE_URL: ${{ inputs.test_live_url }}
          TEST_MAX_SECONDS: ${{ inputs.test_max_seconds }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '' }}
          MAX_DOWNLOAD_GB: ${{ inputs.max_download_gb }}
          PROBE_ONLY: ${{ inputs.probe_only && '1' || '' }}
          YTDLP_PROXY: ${{ (github.event_name == 'schedule' || inputs.use_warp) && 'http://127.0.0.1:40000' || '' }}
          # --- 監視ループ設定（cronが15分間隔で来ない対策） ---
          # schedule 実行のみ 4時間ぶん監視し、終了時に次jobを自己起動する。
          # 手動実行は inputs.watch_seconds（既定0=1回だけ）。
          WATCH_MAX_SECONDS: ${{ github.event_name == 'schedule' && '14400' || inputs.watch_seconds }}
          POLL_INTERVAL: '300'
          SELF_DISPATCH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          SELF_WORKFLOW_FILE: youtube-recorder.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_RETRIES: '3'
        # setup_dependencies.sh が作った .venv の Python を使う
        # （PEP 668 のためシステム pip は使わない）。
        # COOKIES_FILE が存在しない場合 recorder.py 側で警告して継続する。
        run: .venv/bin/python recorder.py
      - name: Dump PO token provider log
        # 失敗調査用。provider が PoToken を生成できているか確認する。
        if: always()
        run: |
          docker ps -a --filter name=bgutil-provider || true
          docker logs --tail 40 bgutil-provider 2>&1 || true

      - name: Warn on YouTube cookie errors
        # 録画は Cookie なし再試行で成功する場合もあるため、ここでは警告に留める。
        # 実際の失敗は recorder.py の終了コード（3/4/5）で job を赤くする。
        if: always()
        run: |
          if [ -f logs/recorder.log ] && grep -qE "cookies are no longer valid|Sign in to confirm you" logs/recorder.log; then
            echo "::warning::YouTube cookies expired or invalid. Update COOKIES_TXT."
          fi
      - name: Upload logs (for debugging)
        # 録画自体には不要だが、失敗時の調査用。artifact は小さいので問題なし。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-logs
          path: ${{ github.workspace }}/logs
          retention-days: 7
      - name: Upload recording as fallback (upload failed)
        # Drive へ上げられなかった録画を artifact として退避する。
        # ランナーは job 終了で消えるため、ここで救わないと録画が失われる。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-fallback-recording
          path: |
            ${{ github.workspace }}/downloads
            ${{ github.workspace }}/comments
          retention-days: 3
          if-no-files-found: warn
      - name: Open issue on failure
        # 失敗を通知する（放置で見逃さない）。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="YouTube recorder job failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            body=$(printf 'The YouTube recorder job failed.\n\nCheck the run:\n%s/%s/actions/runs/%s\n\nLogs are attached as the `recorder-logs` artifact. If the error is a Drive quota error, the recording is saved as `youtube-fallback-recording` (3 days).\n\nCommon causes:\n- `storageQuotaExceeded`: Google Drive is full\n- `cookies are no longer valid` / `Sign in to confirm you` : update `COOKIES_TXT`\n- `quotaExceeded`: YouTube API quota (add another key to `YOUTUBE_API_KEYS`)\n\ncc @%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY_OWNER")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
      - name: Close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="YouTube recorder job failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the recorder job succeeded."
          fi
      - name: Upload test recording (dry-run only)
        # SKIP_UPLOAD=1 のドライラン時のみ。Drive に上げず artifact で回収する。
        if: ${{ inputs.skip_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-test-recording
          path: |
            ${{ github.workspace }}/downloads
            ${{ github.workspace }}/comments
          retention-days: 3
          if-no-files-found: warn
