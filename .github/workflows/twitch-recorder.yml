name: Twitch Live Recorder

# ============================================================
# Keeby Twitch Live Recorder（GitHub Actions版）
#
# 旧Xserver VPS（終了）の代わりに、GitHub Actionsのcronで
# 「配信検知 → 録画＋チャット保存 → Google Driveへアップロード」を1回のjobで完結させる。
#
# 設計上のポイント:
#   * GitHubのscheduleは15分間隔では来ない（実測 中央値5.7時間）。
#     そのため job 自体が最大4時間配信を監視し、終了時に次jobを自己起動する
#     （WATCH_MAX_SECONDS / SELF_DISPATCH）。cronは連鎖が切れたときの保険。
#   * YouTube側と時刻をずらしたcronにして、両方同時に走らないようにしている。
#   * timeout-minutes はActionsの6時間上限に少し余裕を持たせて350分(約5.8時間)。
#   * public repo なので標準ランナーは無料・無制限・支払い方法登録も不要。
# ============================================================

on:
  schedule:
    # 15分間隔（毎時0分は避ける / YouTube側とずらす: 分 12,27,42,57）
    # GitHub Actionsのcronは5フィールド必須（分 時 日 月 曜日）
    - cron: '12,27,42,57 * * * *'
  # 手動実行（初回テスト用・ドライラン用）
  # ドライラン例: test_target_url に適当な配信/動画URL、test_max_seconds に 90、
  # skip_upload に true を指定すると、Drive に触らず artifact で回収できる。
  workflow_dispatch:
    inputs:
      test_target_url:
        description: 'テスト用URL（空なら通常の配信検知。例: https://www.twitch.tv/...）'
        required: false
        default: ''
        type: string
      test_max_seconds:
        description: 'テスト録画秒数（0=打ち切りなし本番動作。例: 90）'
        required: false
        default: '0'
        type: string
      skip_upload:
        description: 'Driveへ上げずローカル保持（テスト用）'
        required: false
        default: false
        type: boolean
      watch_seconds:
        description: '手動実行時の監視秒数（0=1回だけ。本番はcronで自動設定）'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write   # 監視jobの自己ディスパッチ（cron間引き対策）に必要
  issues: write    # 失敗時にIssueを作成して気づけるようにする

concurrency:
  # 手動テスト（test_target_url 指定）は監視チェーンと別グループにする。
  group: twitch-recorder-${{ (github.event_name == 'workflow_dispatch' && inputs.test_target_url != '') && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: bash setup_dependencies.sh

      - name: Setup rclone (Google Drive)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: bash setup_rclone.sh

      - name: Run recorder
        # setup_dependencies.sh が .venv を作り requirements.txt
        # （chat-downloader 含む）を入れ済み。二重 venv は作らず .venv を使用。
        env:
          TWITCH_STREAMER_ID: ${{ vars.TWITCH_STREAMER_ID }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
          GDRIVE_TWITCH_DEST: ${{ vars.GDRIVE_TWITCH_DEST }}
          YT_DLP_BIN: /usr/local/bin/yt-dlp
          # rclone の実体は installer 任せ（/usr/bin 配下になる場合あり）のため
          # PATH 解決に任せる。setup_rclone.sh の `rclone listremotes` と同じ解決になる。
          RCLONE_BIN: rclone
          CHAT_DOWNLOADER_BIN: ${{ github.workspace }}/.venv/bin/chat_downloader
          KEEBY_BASE_DIR: ${{ github.workspace }}
          LOG_DIR: ${{ github.workspace }}/logs
          TEST_TARGET_URL: ${{ inputs.test_target_url }}
          TEST_MAX_SECONDS: ${{ inputs.test_max_seconds }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '' }}
          # --- 監視ループ設定（cronが15分間隔で来ない対策） ---
          WATCH_MAX_SECONDS: ${{ github.event_name == 'schedule' && '14400' || inputs.watch_seconds }}
          POLL_INTERVAL: '180'
          SELF_DISPATCH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          SELF_WORKFLOW_FILE: twitch-recorder.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_RETRIES: '3'
        run: .venv/bin/python twitch_recorder.py

      - name: Upload logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-recorder-logs
          path: ${{ github.workspace }}/logs
          retention-days: 7

      - name: Upload recording as fallback (upload failed)
        # Drive へ上げられなかった録画を artifact として退避する。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-fallback-recording
          path: ${{ github.workspace }}/twitch_temp
          retention-days: 3
          if-no-files-found: warn

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Twitch recorder job failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            body=$(printf 'The Twitch recorder job failed.\n\nCheck the run:\n%s/%s/actions/runs/%s\n\nLogs are attached as the `twitch-recorder-logs` artifact. If the error is a Drive quota error, the recording is saved as `twitch-fallback-recording` (3 days).\n\nCommon causes:\n- `storageQuotaExceeded`: Google Drive is full\n- yt-dlp error: check `ytdlp-twitch-stderr.log`' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Twitch recorder job failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the recorder job succeeded."
          fi

      - name: Upload test recording (dry-run only)
        # SKIP_UPLOAD=1 のドライラン時のみ。Drive に上げず artifact で回収する。
        if: ${{ inputs.skip_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: twitch-test-recording
          path: ${{ github.workspace }}/twitch_temp
          retention-days: 3
          if-no-files-found: warn
