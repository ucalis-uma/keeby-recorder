name: Twitch Live Recorder

# ============================================================
# Keeby Twitch Live Recorder（GitHub Actions版）
#
# 旧Xserver VPS（終了）の代わりに、GitHub Actionsのcronで
# 「配信検知 → 録画＋チャット保存 → Google Driveへアップロード」を1回のjobで完結させる。
#
# 設計上のポイント:
#   * 15分間隔で起動。毎回1回だけ生存チェックし配信中なら録画、なければ即終了。
#   * YouTube側と時刻をずらしたcronにして、両方同時に走らないようにしている。
#   * timeout-minutes はActionsの6時間上限に少し余裕を持たせて350分(約5.8時間)。
#   * public repo なので標準ランナーは無料・無制限・支払い方法登録も不要。
# ============================================================

on:
  schedule:
    # 15分間隔（毎時0分は避ける / YouTube側とずらす: 分 12,27,42,57）
    # GitHub Actionsのcronは5フィールド必須（分 時 日 月 曜日）
    - cron: '12,27,42,57 * * * *'
  # 手動実行（初回テスト用・ドライラン用）
  # ドライラン例: test_target_url に適当な配信/動画URL、test_max_seconds に 90、
  # skip_upload に true を指定すると、Drive に触らず artifact で回収できる。
  workflow_dispatch:
    inputs:
      test_target_url:
        description: 'テスト用URL（空なら通常の配信検知。例: https://www.twitch.tv/...）'
        required: false
        default: ''
        type: string
      test_max_seconds:
        description: 'テスト録画秒数（0=打ち切りなし本番動作。例: 90）'
        required: false
        default: '0'
        type: string
      skip_upload:
        description: 'Driveへ上げずローカル保持（テスト用）'
        required: false
        default: false
        type: boolean

concurrency:
  group: twitch-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: bash setup_dependencies.sh

      - name: Setup rclone (Google Drive)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: bash setup_rclone.sh

      - name: Run recorder
        # setup_dependencies.sh が .venv を作り requirements.txt
        # （chat-downloader 含む）を入れ済み。二重 venv は作らず .venv を使用。
        env:
          TWITCH_STREAMER_ID: ${{ vars.TWITCH_STREAMER_ID }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
          GDRIVE_TWITCH_DEST: ${{ vars.GDRIVE_TWITCH_DEST }}
          YT_DLP_BIN: /usr/local/bin/yt-dlp
          # rclone の実体は installer 任せ（/usr/bin 配下になる場合あり）のため
          # PATH 解決に任せる。setup_rclone.sh の `rclone listremotes` と同じ解決になる。
          RCLONE_BIN: rclone
          CHAT_DOWNLOADER_BIN: ${{ github.workspace }}/.venv/bin/chat_downloader
          KEEBY_BASE_DIR: ${{ github.workspace }}
          LOG_DIR: ${{ github.workspace }}/logs
          TEST_TARGET_URL: ${{ inputs.test_target_url }}
          TEST_MAX_SECONDS: ${{ inputs.test_max_seconds }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '' }}
        run: .venv/bin/python twitch_recorder.py

      - name: Upload logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-recorder-logs
          path: ${{ github.workspace }}/logs
          retention-days: 7

      - name: Upload test recording (dry-run only)
        # SKIP_UPLOAD=1 のドライラン時のみ。Drive に上げず artifact で回収する。
        if: ${{ inputs.skip_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: twitch-test-recording
          path: ${{ github.workspace }}/twitch_temp
          retention-days: 3
          if-no-files-found: warn
