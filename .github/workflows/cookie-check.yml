name: YouTube Cookie Check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: youtube-cookie-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Random delay
        run: sleep $((RANDOM % 300))

      - name: Check cookie session
        id: check
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          printf '%s' "$COOKIES_TXT" > cookies.txt
          python cookie_check.py login --cookies cookies.txt --attempts 2

      - name: Open issue on failure
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="YouTube cookie session check failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            body=$(printf 'The hourly YouTube cookie session check failed.\n\nUpdate the `COOKIES_TXT` secret with a fresh export:\nhttps://github.com/%s/settings/secrets/actions\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close issue on recovery
        if: success() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="YouTube cookie session check failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Cookie session check recovered."
          fi
